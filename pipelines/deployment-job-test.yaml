# Test pipeline: does $(azureSubscription) -> $(ServiceConnection<ENV>) resolve inside a
# deployment job? epr-calculator-frontend's DEV7 deploy failed with "Step input
# azureSubscription references service connection $(ServiceConnectionDEV7) which could not
# be found" - its steps run in epr-deployment-pipeline.yaml's `deployment: DeployAppCode`,
# while the other spike pipelines only tested normal jobs.
#
# Mirrors the repos' deployment-pipeline.yaml: loads epr-calculator-frontend's real vars file
# from main and extends a template (pipelines/templates/deployment-job.yaml) that runs a
# deployment job on the 'development' environment. Read-only: only az account show.
# It deploys nothing, but the run shows in the 'development' environment's deployment history.
#
#   lookup: nested       $(azureSubscription), as the repos pass it today (two lookups) - fails
#   lookup: direct       $(ServiceConnection<ENV>) straight in (one lookup) - works
#   lookup: compiletime  ${{ variables.azureSubscription }} - the proposed fix for the repos:
#                        expands to $(ServiceConnection<ENV>) when the pipeline is compiled
# Run each separately: an unresolved connection fails the whole run before it starts.

trigger: none
pr: none

resources:
  repositories:
    - repository: calculatorFrontend
      type: github
      endpoint: DEFRA-ADP
      name: DEFRA/epr-calculator-frontend
      ref: refs/heads/main

parameters:
  - name: env
    displayName: Environment to test (development environments only)
    type: string
    default: DEV7
    values: [DEV1, DEV2, DEV3, DEV4, DEV7, DEV8, DEV9, DEV14]
  - name: lookup
    displayName: How the template gets the service connection
    type: string
    default: compiletime
    values: [nested, direct, compiletime]

variables:
  - template: pipelines/vars/${{ parameters.env }}-development.yaml@calculatorFrontend

extends:
  template: templates/deployment-job.yaml
  parameters:
    displayName: Deployment job ${{ parameters.env }} (${{ parameters.lookup }})
    ${{ if eq(parameters.lookup, 'nested') }}:
      azureSubscription: $(azureSubscription)
    ${{ elseif eq(parameters.lookup, 'direct') }}:
      azureSubscription: $(ServiceConnection${{ parameters.env }})
    ${{ else }}:
      azureSubscription: ${{ variables.azureSubscription }}
