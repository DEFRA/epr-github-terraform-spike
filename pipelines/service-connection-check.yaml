# One read-only check of everything the EPR pipelines use an environment's service connection
# for. Run it per environment when connections are replaced (ELSP-371: the -APP connections) or
# their permissions change; the run's summary page lists what is missing and which repos need it.
#
# Per environment, when moving to new connections:
#   1. Tick "Use the new connection directly": the summary lists what to ask the team for
#   2. Once nothing is missing, point ServiceConnection<ENV> in the ServiceConnections library at it
#   3. Run again unticked: 0 missing, 0 warnings
#
#   Library     ServiceConnection<ENV> in the ServiceConnections library is the new connection (-APP)
#   Repo vars   repos whose vars files still name a connection instead of using the library
#   Apps        each repo's web/function app is visible, and the roles allow deploy + restart
#   App config  pipeline_single_configuration (epr-app-config-settings): its apps, resource group,
#               --subscription by name, a settings list (count only), delete/set/restart via roles
#   Registry    Azure AD login (no admin-user fallback), pull, import (TST/PRE), push (DEV4 CI)
#   Key Vault   SQL admin secret readable (SQL migrations)
#   Storage     shutter page / B2C styling containers with --auth-mode login (DEV1, TST1, PRE1)
#   Copy Image  TST/PRE: pull on devrwdinfac1401 as the connection (import without the Docker
#               password); DEV1: the registry id the templates use is right
#   SonarQube   only with sonarGroup: the group's EPRADO-SonarQubeToken is valid
#
# Resources come from the repos' vars files on main: pipelines/resources/<ENV>.txt, generated by
# scripts/list_resources.py (re-run it when apps, repos or environments change). Checks run in
# scripts/check_connection.py. Read-only: nothing is deployed,
# restarted, imported, pushed or uploaded, and no secret values are printed.
# Copy Image and SonarQube test the templates branch chore/ELSP-371-remove-dev1-keyvault-steps,
# which drops the shared AZD-RWD-DEV1 Key Vault steps.

trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment to check (PRD1 not included)
    type: string
    default: TST1
    values: [DEV1, DEV2, DEV3, DEV4, DEV7, DEV8, DEV9, DEV14, DEV15, TST1, PRE1, PRE2]
  - name: appConnection
    displayName: Use the new connection directly (before the library is switched to it)
    type: boolean
    default: false
  - name: connectionSuffix
    displayName: Suffix of the new connections (AZD-RWD-<env><suffix>, AZR-RWD-<env><suffix> for PRE)
    type: string
    default: -APP
  - name: sonarGroup
    displayName: Variable group with EPRADO-SonarQubeToken to check (none = skip)
    type: string
    default: none
  - name: pool
    displayName: Agent pool (auto = what the deploy templates use - SSV5 for PRE, SSV3 otherwise)
    type: string
    default: auto

variables:
  - group: ServiceConnections
  - ${{ if ne(parameters.sonarGroup, 'none') }}:
    - group: ${{ parameters.sonarGroup }}
  - ${{ if startsWith(parameters.env, 'PRE') }}:
    - { name: expectedConnection, value: 'AZR-RWD-${{ parameters.env }}${{ parameters.connectionSuffix }}' }
  - ${{ else }}:
    - { name: expectedConnection, value: 'AZD-RWD-${{ parameters.env }}${{ parameters.connectionSuffix }}' }
  - ${{ if parameters.appConnection }}:
    - { name: connection, value: $(expectedConnection) }
  - ${{ else }}:
    - { name: connection, value: '$(ServiceConnection${{ parameters.env }})' }

jobs:
  - job: check
    displayName: Service connection ${{ parameters.env }}
    pool:
      ${{ if ne(parameters.pool, 'auto') }}:
        name: ${{ parameters.pool }}
      ${{ elseif startsWith(parameters.env, 'PRE') }}:
        name: DEFRA-COMMON-UBUNTU-SSV5
      ${{ else }}:
        name: DEFRA-COMMON-UBUNTU-SSV3
    steps:
      - checkout: self

      - task: AzureCLI@2
        displayName: Check $(connection)
        inputs:
          azureSubscription: $(connection)
          addSpnToEnvironment: true
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az account show --query "{subscription:name, id:id}" -o table
            python3 scripts/check_connection.py
        env:
          ENV: ${{ parameters.env }}
          CONNECTION: $(connection)
          EXPECTED_CONNECTION: $(expectedConnection)
          LIBRARY_VALUE: $(ServiceConnection${{ parameters.env }})
          SUMMARY_FILE: $(Agent.TempDirectory)/service-connection-summary.md
          SONAR_GROUP: ${{ parameters.sonarGroup }}
          SONAR_TOKEN: $(EPRADO-SonarQubeToken)
